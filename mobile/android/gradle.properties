# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# 1. BOOST MEMORY (Crucial for New Architecture C++ compilation)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# 2. TURN OFF PARALLEL (Prevents thread/memory choking during heavy compilation)
org.gradle.parallel=false

# 3. ENABLE CACHING (Speeds up subsequent builds)
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX package structure
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Enable R8 in release builds
android.enableMinifyInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# Tip: For faster local debugging, change this to your specific test device architecture (e.g., arm64-v8a)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Architecture and Engine settings
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Expo asset configuration
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false
EX_DEV_CLIENT_NETWORK_INSPECTOR=true
expo.useLegacyPackaging=false

# AGP Compatibility flags
android.builtInKotlin=false
android.newDsl=false
expo.inlineModules.watchedDirectories=[]
